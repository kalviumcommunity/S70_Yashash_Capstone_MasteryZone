<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filters for 4K Realistic Elevation Shadows -->
    <filter id="shadow-laptop" x="-20%" y="-20%" width="140%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="32" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.08" />
    </filter>

    <filter id="shadow-base" x="-20%" y="-20%" width="140%" height="180%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#090d16" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <filter id="shadow-float-card" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.08" />
    </filter>

    <filter id="shadow-cube" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#4f46e5" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.2" />
    </filter>

    <filter id="shadow-sphere" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="grad-cube-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="grad-chassis-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="grad-chassis-lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="grad-screen-bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="grad-screen-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <linearGradient id="grad-screen-glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="grad-sphere-1" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3730a3" />
    </radialGradient>

    <radialGradient id="grad-sphere-2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ddd6fe" />
      <stop offset="45%" stop-color="#a78bfa" />
      <stop offset="80%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </radialGradient>

    <linearGradient id="grad-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#f8faff" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="grad-check-circle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- =========================================================================
       1. FLOATING 3D CODE CUBE ON LEFT
       ========================================================================= -->
  <g transform="translate(145, 120)" filter="url(#shadow-cube)">
    <!-- Base Rounded Cube -->
    <rect x="0" y="0" width="115" height="115" rx="28" fill="url(#grad-cube)" />
    <!-- Beveled Light Edge -->
    <rect x="1" y="1" width="113" height="113" rx="27" fill="none" stroke="url(#grad-cube-edge)" stroke-width="2" />
    
    <!-- Code Brackets </ > Symbol -->
    <g transform="translate(24, 32)">
      <!-- Left Bracket < -->
      <path d="M26 12 L8 26 L26 40" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Slash / -->
      <path d="M37 46 L45 6" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
      <!-- Right Bracket > -->
      <path d="M48 12 L66 26 L48 40" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Subtle Floating Orb (Left) -->
  <circle cx="180" cy="360" r="20" fill="url(#grad-sphere-1)" filter="url(#shadow-sphere)" />

  <!-- =========================================================================
       2. 4K ULTRA-HIGH-DEFINITION MACBOOK LAPTOP
       ========================================================================= -->
  <g transform="translate(260, 210)" filter="url(#shadow-laptop)">
    <!-- Laptop Ground Contact Shadow -->
    <ellipse cx="370" cy="510" rx="420" ry="26" fill="#0f172a" opacity="0.18" />
    <ellipse cx="370" cy="508" rx="350" ry="14" fill="#000000" opacity="0.22" />

    <!-- Screen Bezel Outer (Aluminum Shell) -->
    <rect x="40" y="0" width="660" height="470" rx="26" fill="url(#grad-screen-bezel)" stroke="#334155" stroke-width="1.5" />

    <!-- Screen Bezel Highlight Edge -->
    <rect x="41" y="1" width="658" height="468" rx="25" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1" />

    <!-- Camera / Sensor Notch at Top Center -->
    <circle cx="370" cy="14" r="3.5" fill="#090d16" />
    <circle cx="370" cy="14" r="1.5" fill="#1e293b" />

    <!-- Active Display Matrix (Retina OLED Glass) -->
    <rect x="58" y="32" width="624" height="420" rx="8" fill="url(#grad-screen-bg)" />

    <!-- Top Window Chrome (macOS Dots) -->
    <circle cx="82" cy="54" r="6" fill="#ef4444" />
    <circle cx="102" cy="54" r="6" fill="#f59e0b" />
    <circle cx="122" cy="54" r="6" fill="#10b981" />

    <!-- Glowing Python Syntax Code Inside Editor -->
    <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace" font-size="23.5" font-weight="600" letter-spacing="-0.3">
      <!-- Line 1: def mastery(): -->
      <text x="84" y="112">
        <tspan fill="#f43f5e" font-weight="700">def</tspan>
        <tspan fill="#38bdf8"> mastery</tspan><tspan fill="#e2e8f0">():</tspan>
      </text>

      <!-- Line 2:     learn() -->
      <text x="124" y="156">
        <tspan fill="#fbbf24">learn</tspan><tspan fill="#94a3b8">()</tspan>
      </text>

      <!-- Line 3:     practice() -->
      <text x="124" y="200">
        <tspan fill="#38bdf8">practice</tspan><tspan fill="#94a3b8">()</tspan>
      </text>

      <!-- Line 4:     achieve() -->
      <text x="124" y="244">
        <tspan fill="#f59e0b">achieve</tspan><tspan fill="#94a3b8">()</tspan>
      </text>

      <!-- Line 5: empty space -->

      <!-- Line 6:     return "Mastery Zone" -->
      <text x="124" y="330">
        <tspan fill="#f43f5e" font-weight="700">return</tspan>
        <tspan fill="#34d399"> "Mastery Zone"</tspan>
      </text>
    </g>

    <!-- Glass Surface Glare / Sheen -->
    <path d="M58 32 L380 32 L58 360 Z" fill="url(#grad-screen-glare)" />

    <!-- =======================================================================
         Laptop Bottom Base / Keyboard Chassis
         ======================================================================= -->
    <g transform="translate(0, 465)" filter="url(#shadow-base)">
      <!-- Aluminum Lower Deck Surface -->
      <path d="M2 0 L738 0 L718 24 C710 32, 690 36, 670 36 L70 36 C50 36, 30 32, 22 24 Z" fill="url(#grad-chassis-top)" stroke="#64748b" stroke-width="1.2" />

      <!-- Front Lip Reflection / Bevel -->
      <path d="M22 24 L718 24 L708 34 C690 38, 670 40, 650 40 L90 40 C70 40, 50 38, 32 34 Z" fill="url(#grad-chassis-lip)" />

      <!-- Center Thumb Notch for Opening Lid -->
      <rect x="320" y="2" width="100" height="7" rx="3.5" fill="#475569" opacity="0.6" />
      <rect x="322" y="3" width="96" height="5" rx="2.5" fill="#1e293b" opacity="0.4" />
    </g>
  </g>

  <!-- =========================================================================
       3. FLOATING CHECKLIST GLASS CARD ON RIGHT
       ========================================================================= -->
  <g transform="translate(865, 175)" filter="url(#shadow-float-card)">
    <!-- White Glass Container -->
    <rect x="0" y="0" width="220" height="235" rx="24" fill="url(#grad-card)" stroke="#e2e8f0" stroke-width="2" />

    <!-- Card Content: 3 Check Items -->
    <!-- Item 1: Learn -->
    <g transform="translate(26, 36)">
      <circle cx="17" cy="17" r="17" fill="url(#grad-check-circle)" />
      <path d="M11 17 L15 21 L23 12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="24" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#0f172a">Learn</text>
    </g>

    <!-- Item 2: Practice -->
    <g transform="translate(26, 98)">
      <circle cx="17" cy="17" r="17" fill="url(#grad-check-circle)" />
      <path d="M11 17 L15 21 L23 12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="24" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#0f172a">Practice</text>
    </g>

    <!-- Item 3: Grow -->
    <g transform="translate(26, 160)">
      <circle cx="17" cy="17" r="17" fill="url(#grad-check-circle)" />
      <path d="M11 17 L15 21 L23 12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="24" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#0f172a">Grow</text>
    </g>
  </g>

  <!-- =========================================================================
       4. 3D FLOATING PURPLE ORB ON RIGHT
       ========================================================================= -->
  <circle cx="1020" cy="560" r="24" fill="url(#grad-sphere-2)" filter="url(#shadow-sphere)" />
</svg>
