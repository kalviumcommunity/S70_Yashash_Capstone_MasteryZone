<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    </noscript>
    <title>Mastery Zone - Learn • Grow • Achieve</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("mz_theme_preference") || localStorage.getItem("mz_theme") || "light";
          var isDark =
            pref === "dark" ||
            (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var resolved = isDark ? "dark" : "light";
          var root = document.documentElement;
          root.setAttribute("data-theme", resolved);
          root.setAttribute("data-theme-preference", pref);
          root.classList.toggle("mz-theme-dark", isDark);
          root.classList.toggle("mz-theme-light", !isDark);
          root.classList.toggle("mz-c-dark", isDark);
          root.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
   
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
