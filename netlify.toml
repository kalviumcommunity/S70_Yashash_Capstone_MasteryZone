[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

[build.environment]
  VITE_API_URL = "https://mastery-zone.onrender.com"
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://mastery-zone.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://mastery-zone.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/recordings/*"
  to = "https://mastery-zone.onrender.com/recordings/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/certificates/*"
  to = "https://mastery-zone.onrender.com/certificates/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://mastery-zone.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/proctoring-evidence/*"
  to = "https://mastery-zone.onrender.com/proctoring-evidence/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
